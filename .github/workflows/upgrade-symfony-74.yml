name: Upgrade Symfony 7.3 to 7.4

on:
  push:
    branches: [upgrade-symfony-7.4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Configure Git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Composer update
        shell: bash {0}
        run: |
          echo "PHP: $(php -v | head -1)" > composer-update.log
          composer --version >> composer-update.log
          composer update --with-all-dependencies --no-interaction --no-progress >> composer-update.log 2>&1
          echo "composer exit=$?" >> composer-update.log
          php bin/console cache:clear --env=prod >> composer-update.log 2>&1
          echo "cache clear exit=$?" >> composer-update.log
          exit 0

      - name: Show log tail
        if: always()
        shell: bash {0}
        run: tail -60 composer-update.log

      - name: Commit results (always)
        if: always()
        shell: bash {0}
        run: |
          git add composer.lock composer-update.log
          git commit -m "Upgrade Symfony to 7.4: composer update results" || echo "no changes to commit"
          git push origin HEAD:upgrade-symfony-7.4 || echo "push failed"
