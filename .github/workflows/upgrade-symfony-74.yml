name: Upgrade Symfony 7.3 to 7.4

on:
  push:
    branches: [upgrade-symfony-7.4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Composer update (logged)
        id: upd
        run: |
          set +e
          composer update --with-all-dependencies --no-interaction --no-progress -vv > composer-update.log 2>&1
          echo "exit=$?" >> composer-update.log
          composer validate --no-check-all 2>> composer-update.log

      - name: Show log tail
        run: tail -40 composer-update.log

      - name: Commit results (even on failure)
        run: |
          git add composer.lock composer-update.log 2>/dev/null || true
          git commit -m "composer update logs" 2>/dev/null || echo "no changes"
          git push origin HEAD:upgrade-symfony-7.4
