name: Upgrade Symfony 7.3 to 7.4

on:
  push:
    branches: [upgrade-symfony-7.4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Configure Git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Composer update (logged)
        if: always()
        run: |
          {
            echo "PHP: $(php -v 2>&1 | head -1)"
            echo "Composer: $(composer --version 2>&1)"
            composer validate 2>&1
            composer update --with-all-dependencies --no-interaction --no-progress 2>&1
            echo "exit=$?"
          } > composer-update.log 2>&1
          echo "--- done ---"

      - name: Show log tail
        if: always()
        run: tail -60 composer-update.log || echo "no log file"

      - name: Commit results (always)
        if: always()
        run: |
          git add composer.lock composer-update.log || true
          git commit -m "composer update results (diagnostic)" || echo "no changes"
          git push origin HEAD:upgrade-symfony-7.4 || echo "push failed"
